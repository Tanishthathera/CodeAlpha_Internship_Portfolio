<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha | Glassmorphism Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-circles">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="calc-container">
        <div class="calculator">
            <div class="display">
                <input type="text" id="result" placeholder="0" readonly>
            </div>
            <div class="buttons">
                <button onclick="clearDisplay()" class="btn-action">AC</button>
                <button onclick="deleteLast()" class="btn-action">DEL</button>
                <button onclick="appendOperator('%')" class="btn-operator">%</button>
                <button onclick="appendOperator('/')" class="btn-operator">÷</button>
                
                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button onclick="appendOperator('*')" class="btn-operator">×</button>
                
                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button onclick="appendOperator('-')" class="btn-operator">−</button>
                
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button onclick="appendOperator('+')" class="btn-operator">+</button>
                
                <button onclick="appendNumber('0')">0</button>
                <button onclick="appendNumber('.')">.</button>
                <button onclick="calculate()" class="btn-equal"> = </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
