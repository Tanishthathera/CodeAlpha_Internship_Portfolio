<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Music Player | CodeAlpha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="player-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search Song/Artist...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>

        <div class="music-card">
            <div class="img-area">
                <img src="https://via.placeholder.com/250" alt="Album Art" id="track-art">
            </div>
            
            <div class="song-details">
                <h2 id="track-name">Search a Song</h2>
                <p id="track-artist">Artist Name</p>
            </div>

            <audio id="main-audio"></audio>

            <div class="progress-area">
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <div class="timer">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button id="prev"><i class="fas fa-step-backward"></i></button>
                <button id="play-pause" class="play-btn"><i class="fas fa-play"></i></button>
                <button id="next"><i class="fas fa-step-forward"></i></button>
            </div>

            <div class="volume-box">
                <i class="fas fa-volume-up" id="vol-icon"></i>
                <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.8">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
